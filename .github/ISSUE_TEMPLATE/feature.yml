name: Feature request
description: Suggest an improvement or a new model.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could the package solve it? For a new model, link Mistral's documentation for its ID, limits and capabilities.
    validations:
      required: false
