name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: When you installed or last updated the package (or the commit, if you know it), the release tag if you pinned one (e.g. `v0.1.0`), and your Pi version (`pi --version`).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and your Mistral plan if relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands, for example `pi --model mistral/mistral-medium-3.5`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error message. Remove API keys, tokens and anything from your Pi auth file.
    validations:
      required: true
